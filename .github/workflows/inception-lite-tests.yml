name: INCEPTION-Lite CPU validation
on:
  push:
    branches: [dev/pulsejet-injections]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  injection-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned-range scientific dependencies
        run: python -m pip install -r requirements-inception-lite.txt
      - name: Test injection planning and Doppler physics
        run: python -m unittest discover -s tests -p 'test_inception_lite.py' -v
      - name: Verify optional PulsarX truth-fold interface
        run: python -m unittest discover -s tests -p 'test_folding.py' -v
      - name: Validate generated filterbank with real INCEPTION injector
        run: python -m unittest discover -s tests -p 'smoke_injection.py' -v
      - name: Verify real jerk injection recovers with correct phase sign
        run: python -m unittest discover -s tests -p 'stress_jerk_injection.py' -v
      - name: Test multi-pulsar shared-filterbank injection and parallel workers
        run: python -m unittest discover -s tests -p 'smoke_multi_injection.py' -v
      - name: Validate 100-source orbital injection catalogue and batch safety
        run: python -m unittest discover -s tests -p 'test_ucb100_plan.py' -v
      - name: Syntax-check generic and two-node compact-binary SLURM launchers
        run: |
          bash -n scripts/slurm_inception_lite.sh
          bash -n scripts/slurm_m62_ucb100_batch.sh
      - name: Show standalone CLI help
        run: |
          python -m inception_lite --help
          python -m inception_lite.make_filterbank --help
