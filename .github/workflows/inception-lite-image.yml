name: INCEPTION-Lite CPU Docker image build
on:
  push:
    branches: [dev/pulsejet-injections]
    paths:
      - Dockerfile.inception-lite
      - requirements-inception-lite.txt
      - .dockerignore
      - .github/workflows/inception-lite-image.yml
      - ci/request-image-build.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build reproducible injection image with tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.inception-lite
          platforms: linux/amd64
          push: false
          load: true
          tags: inception-lite:ci
      - name: Verify image CLI runs without Nextflow
        run: |
          docker run --rm inception-lite:ci python -m inception_lite --help
          docker run --rm inception-lite:ci python -m inception_lite.make_filterbank --help
